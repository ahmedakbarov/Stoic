workflows:
  android-apk:
    name: Android APK (Direct Install)
    max_build_duration: 60
    environment:
      node: 20.17.0

    scripts:
      - name: Install dependencies
        script: npm install

      - name: Generate native Android project
        script: npx expo prebuild --platform android --clean

      - name: Build debug APK with bundled JS
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -PbundleInDebug=true

    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
