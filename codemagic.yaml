workflows:
  android-apk:
    name: Android APK (Direct Install)
    max_build_duration: 60
    environment:
      node: 20.17.0

    scripts:
      - name: Install dependencies
        script: npm install

      - name: Generate native Android project
        script: npx expo prebuild --platform android --clean

      - name: Bundle JS + generate keystore + build release APK
        script: |
          set -e

          # Step 1 — Pre-bundle JavaScript using Expo's bundler
          mkdir -p android/app/src/main/assets
          node node_modules/.bin/react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res \
            --reset-cache
          echo "✅ Bundle created: $(wc -c < android/app/src/main/assets/index.android.bundle) bytes"

          # Step 2 — Generate self-signed keystore
          KEYSTORE="$PWD/android/app/stoic.keystore"
          keytool -genkey -v \
            -keystore "$KEYSTORE" \
            -alias stoic \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android123 \
            -keypass android123 \
            -dname "CN=Stoic Companion,O=Stoic,C=AZ"
          echo "✅ Keystore created at $KEYSTORE"

          # Step 3 — Build release APK (skip Gradle re-bundling since we bundled above)
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PbundleInRelease=false \
            -Pandroid.injected.signing.store.file="$KEYSTORE" \
            -Pandroid.injected.signing.store.password=android123 \
            -Pandroid.injected.signing.key.alias=stoic \
            -Pandroid.injected.signing.key.password=android123
          echo "✅ APK built successfully"

    artifacts:
      - android/app/build/outputs/apk/release/app-release.apk
