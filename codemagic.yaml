workflows:
  android-apk:
    name: Android APK (Direct Install)
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      node: 20.17.0
      java: 17

    scripts:
      - name: Install dependencies
        script: npm install

      - name: Generate native Android project
        script: npx expo prebuild --platform android --clean

      - name: Generate keystore + build release APK
        script: |
          set -e

          # Step 1 — Generate self-signed keystore
          KEYSTORE="$PWD/android/app/stoic.keystore"
          keytool -genkey -v \
            -keystore "$KEYSTORE" \
            -alias stoic \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android123 \
            -keypass android123 \
            -dname "CN=Stoic Companion,O=Stoic,C=AZ"
          echo "✅ Keystore created at $KEYSTORE"

          # Step 2 — Build release APK (Gradle bundles JS automatically)
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE" \
            -Pandroid.injected.signing.store.password=android123 \
            -Pandroid.injected.signing.key.alias=stoic \
            -Pandroid.injected.signing.key.password=android123
          echo "✅ APK built successfully"

    artifacts:
      - android/app/build/outputs/apk/release/app-release.apk
